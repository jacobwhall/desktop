name: coder

# Builds the Fedora Coder envbox inner image (coder/Containerfile) and pushes it
# to ghcr.io/<owner>/coder.
#
# This is deliberately separate from the bluebuild workflow: that one builds
# bootable OSTree desktop images from BlueBuild recipes, while this builds a
# plain OCI app container. They share nothing but the repository.
#
# The image name is NOT derived from ${{ github.repository }} — that would be
# 'desktop', which the bluebuild workflow already publishes. It is also distinct
# from the older ghcr.io/<owner>/fedora-coder, which this supersedes but does
# not overwrite; that one still has a 'coder' workspace user, this one 'jacob'.

on:
  push:
    branches: [main]
    paths:
      - coder/**
      - .github/workflows/coder.yml
  pull_request:
    paths:
      - coder/**
      - .github/workflows/coder.yml
  workflow_dispatch:
  schedule:
    # Weekly rebuild to pick up Fedora base-image and package security updates.
    - cron: "0 6 * * 1"

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Fedora versions to publish. Each becomes a tag (e.g. :43, :44);
        # the newest also gets :latest (see the tag step below).
        fedora_version: ["43", "44"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        # Skip on PRs from forks, which can't get a write-scoped token.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          # GHCR requires a lowercase image path.
          image="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/coder"
          tags="${image}:${{ matrix.fedora_version }}"
          # Point :latest at the newest Fedora in the matrix.
          if [ "${{ matrix.fedora_version }}" = "44" ]; then
            tags="${tags},${image}:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./coder
          file: ./coder/Containerfile
          build-args: |
            FEDORA_VERSION=${{ matrix.fedora_version }}
          # Only push for real events, not PR validation builds.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Fedora ${{ matrix.fedora_version }} Coder envbox inner image
          cache-from: type=gha
          cache-to: type=gha,mode=max
